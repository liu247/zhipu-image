[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhipu-image-mcp"
version = "0.1.0"
description = "通用 MCP Server 库:调用智谱(GLM-4V 系列)视觉模型进行图像理解"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhipu-image" }]
keywords = ["mcp", "zhipu", "glm-4v", "vision", "image", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp-slim[server]>=3.0.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
zhipu-image-mcp = "zhipu_image_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zhipu_image_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
